name: Build and Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.*'
      - 'LICENSE'
      - '.github/**/*.md'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha256: ${{ steps.sha.outputs.sha256 }}

    env:
      KT_NAME: GitProfileSwitch
      APP_NAME: profile
      REPO_LOCATION: https://github.com/OmyDaGreat/Profile
      BUCKET_LOCATION: OmyDaGreat/MaleficBucket
      BUCKET_NAME: malefic
      DESCRIPTION: A terminal-based git profile switcher made with Kotlin
      JAVA_VERSION: '21'
      KOTLIN_VERSION: '2.1.10'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Kotlin
        uses: fwilhe2/setup-kotlin@v2.1
        with:
          version: ${{ env.KOTLIN_VERSION }}

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Determine Version
        id: version
        run: |
          # Get the latest tag or default to 0.1.0 if no tags exist
          git fetch --tags
          latest_tag=$(git tag -l "v*" | sort -V | tail -n 1)

          if [ -z "$latest_tag" ]; then
            latest_version="0.1.0"
          else
            latest_version="${latest_tag#v}"
          fi

          # Split version into major, minor, patch
          IFS='.' read -r major minor patch <<< "$latest_version"

          # Bump version based on input or default to patch
          bump_type="${{ github.event.inputs.version_bump || 'patch' }}"

          if [ "$bump_type" == "major" ]; then
            major=$((major + 1))
            minor=0
            patch=0
          elif [ "$bump_type" == "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          new_version="$major.$minor.$patch"
          echo "New version: $new_version"
          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "tag=v$new_version" >> $GITHUB_OUTPUT

      - name: Compile Kotlin Application
        run: |
          mkdir -p build
          kotlinc ${{ env.KT_NAME }}.kt -include-runtime -d build/${{ env.APP_NAME }}.jar

      - name: Prepare Files for Packaging
        run: |
          mkdir -p package
          cp build/${{ env.APP_NAME }}.jar package/
          cp LICENSE package/ || echo "LICENSE file not found"
          cp README.adoc package/ || echo "README.adoc file not found"

          # Create batch file
          echo '@echo off' > package/${{ env.APP_NAME }}.bat
          echo 'java -jar "%~dp0\${{ env.APP_NAME }}.jar" %*' >> package/${{ env.APP_NAME }}.bat

      - name: Verify ${{ env.APP_NAME }}.bat File Exists
        run: |
          if [ ! -f package/${{ env.APP_NAME }}.bat ]; then
            echo "${{ env.APP_NAME }}.bat file not found!"
            exit 1
          fi

      - name: Create ZIP Archive
        run: |
          cd package
          zip -r ../${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.zip ./*

      - name: Calculate SHA256
        id: sha
        run: |
          checksum=$(sha256sum ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.zip | awk '{print $1}')
          echo "sha256=$checksum" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            Release ${{ steps.version.outputs.version }} - ${{ steps.date.outputs.date }}

            ### SHA256 Checksum
            ```
            ${{ steps.sha.outputs.sha256 }}
            ```

            ### Installation via Scoop
            ```
            scoop bucket add ${{ env.BUCKET_NAME }} https://github.com/${{ env.BUCKET_LOCATION }}
            scoop install ${{ env.APP_NAME }}
            ```
          draft: false
          prerelease: false
          files: |
            ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.zip

  package-managers:
    name: Update Scoop Bucket
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      RELEASES: https://github.com/OmyDaGreat/Profile/releases/download/${{ needs.build.outputs.tag }}
      SHA256: ${{ needs.build.outputs.sha256 }}
      REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
    steps:
      - name: Check for repository token
        id: token
        run: |
          if [ -z "$REPO_ACCESS_TOKEN" ]; then
            echo "::warning::REPO_ACCESS_TOKEN is not set; skipping Scoop update."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Scoop manifest
        if: steps.token.outputs.present == 'true'
        run: |
          git clone "https://x-access-token:${REPO_ACCESS_TOKEN}@github.com/OmyDaGreat/MaleficBucket.git"
          cd MaleficBucket
          mkdir -p bucket
          cat > bucket/profile.json << EOF
          {
              "version": "${VERSION}",
              "description": "A terminal-based git profile switcher made with Kotlin",
              "homepage": "https://github.com/OmyDaGreat/Profile",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "${RELEASES}/profile-${VERSION}.zip",
                      "hash": "${SHA256}"
                  }
              },
              "bin": "profile.bat",
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/OmyDaGreat/Profile/releases/download/v\$version/profile-\$version.zip"
                      }
                  }
              }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/profile.json
          git commit -m "profile: update to ${VERSION}"
          git push
